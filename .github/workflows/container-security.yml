name: Container security

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    name: Scan runtime container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build runtime image from selected commit
        run: docker build --pull --tag mcp-email-server:security .

      # Always write SARIF so the artifact is available even when the later
      # gating scan fails the job. Do not set exit-code 1 here.
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-email-server:security
          scan-type: image
          scanners: vuln
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: error

      # Private repos on GitHub Free have no code scanning. Skip unless the
      # repo variable is set, and never fail the job on upload errors.
      - name: Upload vulnerability report
        if: vars.ENABLE_CODE_SCANNING == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: container-main-build

      # Real gate: unfixed HIGH/CRITICAL findings fail the job after the
      # SARIF artifact (and optional code-scanning upload) have run.
      - name: Fail on unfixed HIGH or CRITICAL findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mcp-email-server:security
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
