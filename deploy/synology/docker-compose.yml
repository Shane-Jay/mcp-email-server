# Synology NAS / Container Manager compose kit for mcp-email-server.
# Copy env.example to .env, fill placeholders, create secret files, then:
#   docker compose up -d
#
# Pin the image by digest in production, for example:
#   image: ghcr.io/shane-jay/mcp-email-server@sha256:<digest>
#
# Access mode is selected in .env (compose cannot compute it):
#   lan   (default): MCP_BIND_IP=0.0.0.0  — LAN and WireGuard-routed subnets
#   local:           MCP_BIND_IP=127.0.0.1 — NAS loopback only
# The process still binds 0.0.0.0 *inside* the container so the healthcheck
# can use 127.0.0.1. Docker publishes the host port only on MCP_BIND_IP.

services:
  mcp-email:
    image: ghcr.io/shane-jay/mcp-email-server:latest
    command: ["streamable-http", "--host", "0.0.0.0", "--port", "9557"]
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    group_add:
      - "100"
    env_file:
      - .env
    environment:
      HOME: /data
      TMPDIR: /tmp
      MCP_EMAIL_SERVER_CONFIG_PATH: /data/config.toml
      MCP_EMAIL_SERVER_ATTACHMENT_DIR: /data/attachments
      MCP_EMAIL_HTTP_BEARER_TOKEN_FILE: /run/secrets/http_bearer_token
      MCP_EMAIL_SERVER_ACCOUNT_netease_PASSWORD_FILE: /run/secrets/netease_auth_code
      MCP_EMAIL_SERVER_ACCOUNT_aliyun_PASSWORD_FILE: /run/secrets/aliyun_auth_code
      MCP_EMAIL_SERVER_ACCOUNT_icloud_PASSWORD_FILE: /run/secrets/icloud_app_password
    ports:
      - "${MCP_BIND_IP:-0.0.0.0}:9557:9557"
    volumes:
      - ${MCP_DATA_DIR:-/volume1/docker/mcp-email-server/data}:/data
      - ${MCP_ATTACHMENT_DIR:-/volume1/docker/mcp-email-server/attachments}:/data/attachments
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    secrets:
      - http_bearer_token
      - netease_auth_code
      - aliyun_auth_code
      - icloud_app_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9557/healthz', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

secrets:
  http_bearer_token:
    file: ${MCP_SECRETS_DIR:-./secrets}/http_bearer_token
  netease_auth_code:
    file: ${MCP_SECRETS_DIR:-./secrets}/netease_auth_code
  aliyun_auth_code:
    file: ${MCP_SECRETS_DIR:-./secrets}/aliyun_auth_code
  icloud_app_password:
    file: ${MCP_SECRETS_DIR:-./secrets}/icloud_app_password
